name: Agent de correction

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: "Identifiant UUID de la proposition approuvée"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-runner:
    name: Préparer le runner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Vérifier l’identifiant de proposition
        env:
          PROPOSAL_ID: ${{ inputs.proposal_id }}
        run: |
          if [[ ! "$PROPOSAL_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "Identifiant de proposition invalide."
            exit 1
          fi

          echo "Identifiant reçu : $PROPOSAL_ID"

      - name: Confirmer le runner
        run: |
          echo "Runner GitHub prêt."
          echo "Branche : $GITHUB_REF_NAME"
          echo "Commit : $(git rev-parse --short HEAD)"
